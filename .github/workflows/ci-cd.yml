# CI/CD Pipeline for ComfyUIPod

This workflow automates validation, security scanning, Docker builds, and deployment for the ComfyUIPod project.

## Features
- **Validation**: Runs Python, Rust, and Nginx validation commands.
- **Security Scanning**: Uses Trivy to scan Docker images for vulnerabilities.
- **Immutable Tags**: Tags Docker images with Git commit SHA and semantic version.
- **Image Signing**: Signs Docker images with Cosign for integrity.
- **Deployment**: Deploys to Kubernetes with rollback support.

