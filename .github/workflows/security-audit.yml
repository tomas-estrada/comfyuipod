name: Security Audit (cargo-audit + pip-audit)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at 00:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cargo-audit:
    name: Rust Dependency Audit (comfyctl)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: comfyctl
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar toolchain Rust 1.86.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16 head
        with:
          toolchain: "1.86.0"

      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked

      - name: Ejecutar cargo-audit
        run: cargo audit --deny warnings

  pip-audit:
    name: Python Dependency Audit (studio, scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar pip-audit
        run: python3 -m pip install pip-audit --user

      - name: Ejecutar pip-audit en studio/
        run: python3 -m pip_audit -r studio/requirements.txt

      - name: Ejecutar pip-audit en scripts/
        run: |
          if [ -f scripts/requirements.txt ]; then
            python3 -m pip_audit -r scripts/requirements.txt
          else
            echo "No requirements.txt found in scripts/"
          fi