name: Build, Validate and Publish ComfyUI Vast.ai Image (GHCR)

"on":
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Solo lectura a nivel de workflow; packages: write se concede únicamente al job build-and-push.
  contents: read

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Scripts, Action SHAs, Dockerfile & HF Catalog (CI-01 / CI-03)
    # ubuntu-latest migra 24.04->26.04 entre 2026-10-19 y 2026-11-19 (no determinismo a mitad
    # del rollout); fijamos 24.04 para determinismo run a run. Todos los jobs verificados
    # compatibles con 26.04, así que tras 2026-11-19 se puede volver a ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ejecutar ShellCheck sobre scripts Bash (§9.1)
        run: |
          shellcheck scripts/start.sh scripts/download-models.sh tools/mac/comfy

      - name: Validar sondas Python, esquema de triage_patterns.json, paridad O-11 y portal sin CDN (§9.1)
        run: |
          python3 -m py_compile config/probes/*.py scripts/check_models_manifest.py
          python3 - << 'EOF'
          import json, pathlib, re

          patterns = json.loads(pathlib.Path("scripts/triage_patterns.json").read_text(encoding="utf-8"))
          assert isinstance(patterns, list) and len(patterns) >= 17, f"Expected >=17 patterns, got {len(patterns)}"
          required = {"id", "sources", "pattern", "severity", "cause", "first_command"}
          seen_ids = set()
          for p in patterns:
              missing = required - set(p.keys())
              assert not missing, f"Pattern {p.get('id')} missing keys: {missing}"
              assert p["id"] not in seen_ids, f"Duplicate pattern id: {p['id']}"
              seen_ids.add(p["id"])
              assert p["severity"] in ("alta", "media", "baja"), f"Invalid severity in {p['id']}"
              re.compile(p["pattern"], re.I)

          portal = pathlib.Path("config/portal/index.html")
          portal_bytes = portal.stat().st_size
          assert portal_bytes < 40960, f"Portal index.html exceeds 40 KiB ({portal_bytes} bytes)"
          allowed_links = {"https://github.com/Comfy-Org/ComfyUI"}
          for html_path in (portal, pathlib.Path("config/_starting.html"), pathlib.Path("comfyctl/src/status_html.html")):
              txt = html_path.read_text(encoding="utf-8")
              assert "http://" not in txt.lower(), f"Insecure http:// found in {html_path}"
              res_refs = re.findall(r'(?:src\s*=\s*["\']https?://|<link[^>]+href\s*=\s*["\']https?://|@import\s+["\']https?://|url\(\s*["\']?https?://)', txt, re.I)
              assert not res_refs, f"External CDN/resource reference found in {html_path}: {res_refs}"
              for href in re.findall(r'href\s*=\s*["\'](https://[^"\']+)["\']', txt, re.I):
                  assert href in allowed_links, f"Unapproved external link in {html_path}: {href}"

          # O-11: Verificar paridad entre catálogo de download-models.sh y EXPECTED_MODELS de comfyctl/src/collect/models.rs
          dl_txt = re.sub(r"\\\s*\n", " ", pathlib.Path("scripts/download-models.sh").read_text(encoding="utf-8"))
          dl_files = [
              ("det_10g.onnx" if m[3] == "buffalo_l.zip" else m[3])
              for m in re.findall(r'hf_fetch\s+"([^"]+)"\s+"([^"]+)"\s+"([^"]+)"\s+"([^"]+)"\s+"([^"]+)"', dl_txt)
          ]
          models_rs = pathlib.Path("comfyctl/src/collect/models.rs").read_text(encoding="utf-8")
          expected_files = re.findall(r'filename:\s*"([^"]+)"', models_rs)
          assert set(dl_files) == set(expected_files) and len(dl_files) == len(expected_files), (
              f"Model mismatch between download-models.sh ({dl_files}) and comfyctl EXPECTED_MODELS ({expected_files})"
          )

          # Validar estructura de los esquemas congelados docs/contratos/*.schema.json y bloque strict (R-04 / R-08 / R-13)
          status_schema = json.loads(pathlib.Path("docs/contratos/status-api.schema.json").read_text(encoding="utf-8"))
          sup_schema = json.loads(pathlib.Path("docs/contratos/supervisor-state.schema.json").read_text(encoding="utf-8"))
          assert "generated_at" in status_schema.get("required", []), "status-api.schema.json inválido"
          assert "state" in sup_schema.get("required", []), "supervisor-state.schema.json inválido"
          strict_props = status_schema["properties"]["strict"]["properties"]
          check_item_props = set(strict_props["checks"]["items"]["properties"].keys())
          assert check_item_props == {"id", "name", "status", "detail", "remediation"}, f"Unexpected strict check item props: {check_item_props}"

          for view_path in (pathlib.Path("config/portal/index.html"), pathlib.Path("comfyctl/src/status_html.html"), pathlib.Path("tools/mac/comfy")):
              vtxt = view_path.read_text(encoding="utf-8")
              for forbidden in ("c.message", "c.observed", "c.expected", 'c.get("message")', 'c.get("observed")', 'c.get("expected")'):
                  assert forbidden not in vtxt, f"Forbidden legacy strict field {forbidden} in {view_path}"

          print(f"Validated {len(patterns)} triage patterns, {len(expected_files)} expected models, frozen schemas (incl. strict), and portal ({portal_bytes} bytes, 0 external CDN refs).")
          EOF

      - name: Ejecutar download-models.sh en seco con HF_CLI simulado y contrastar formato con parser (R-01 / R-08 / S-01 / S-02 / VAL-PROFILE-002 / VAL-UNREAL-003)
        run: |
          set -euo pipefail
          # Dry-run con hf simulado: no escribe datos reales; el cortacircuitos de
          # disco no debe depender del espacio libre del runner.
          export HF_DISK_GUARD=0
          tmp_root="$(mktemp -d)"
          trap 'rm -rf "$tmp_root"' EXIT
          mkdir -p "$tmp_root/bin" "$tmp_root/data"
          cat > "$tmp_root/bin/fake-hf" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          # hf_fetch invoca: hf download <repo_id> <remote_path> --repo-type <tipo> --local-dir <stage>
          repo_path="${3:?}"
          stage_dir=""
          while [ "$#" -gt 0 ]; do
            if [ "$1" = "--local-dir" ]; then
              stage_dir="$2"
              shift 2
              continue
            fi
            shift
          done
          [ -n "${stage_dir}" ] || { echo "fake-hf: falta --local-dir" >&2; exit 1; }
          mkdir -p "$(dirname "${stage_dir}/${repo_path}")"
          incomplete_file="${stage_dir}/.cache/huggingface/download/${repo_path}.incomplete"
          if [ ! -s "${incomplete_file}" ] && [ -s "${stage_dir}/${repo_path}.incomplete" ]; then
            incomplete_file="${stage_dir}/${repo_path}.incomplete"
          fi
          if [[ "$repo_path" == *.zip ]]; then
            cp "${HF_FIXTURE_BUFFALO_ZIP}" "${stage_dir}/${repo_path}"
          elif [ -s "${incomplete_file}" ]; then
            cat "${incomplete_file}" > "${stage_dir}/${repo_path}"
            printf 'bytes' >> "${stage_dir}/${repo_path}"
            rm -f "${incomplete_file}"
          else
            printf 'fake-model-bytes' > "${stage_dir}/${repo_path}"
          fi
          EOF
          chmod +x "$tmp_root/bin/fake-hf"
          # Test manifests retain real repo/path/revision mappings while replacing
          # model bytes and hashes with tiny deterministic fixtures. The production
          # acquirer still verifies every fixture before publishing it.
          python3 - "$tmp_root" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          archive = root / "buffalo-fixture.zip"
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_STORED) as zf:
              info = zipfile.ZipInfo("buffalo_l/det_10g.onnx", (1980, 1, 1, 0, 0, 0))
              info.compress_type = zipfile.ZIP_STORED
              zf.writestr(info, b"fake-onnx-bytes")
          archive_bytes = archive.read_bytes()
          payloads = {"default": b"fake-model-bytes", "buffalo": archive_bytes}
          for source, target in (("config/models-core.json", "models-core.json"), ("config/models-studio.json", "models-studio.json")):
              data = json.loads(pathlib.Path(source).read_text(encoding="utf-8"))
              for model in data["models"]:
                  payload = payloads["buffalo"] if model.get("remote_path") == "models/buffalo_l.zip" else payloads["default"]
                  model["bytes"] = len(payload)
                  model["sha256"] = hashlib.sha256(payload).hexdigest()
                  model.pop("sha1", None)
              (root / target).write_text(json.dumps(data), encoding="utf-8")
          PY
          export PYTHONPATH="$GITHUB_WORKSPACE/studio"
          export STUDIO_CORE_MANIFEST="$tmp_root/models-core.json"
          export STUDIO_MANIFEST="$tmp_root/models-studio.json"
          export HF_FIXTURE_BUFFALO_ZIP="$tmp_root/buffalo-fixture.zip"
          bash scripts/download-models.sh --selftest
          # stdout (trazas [MODELS]) a dl.log; stderr aparte (ruido de /root sin permisos, etc.)
          COMFY_DATA_DIR="$tmp_root/data" HF_CLI="$tmp_root/bin/fake-hf" MODEL_PROFILE=general \
            bash scripts/download-models.sh --phase1 > "$tmp_root/dl.log" 2>"$tmp_root/dl.err" || { cat "$tmp_root/dl.log"; cat "$tmp_root/dl.err"; exit 1; }
          COMFY_DATA_DIR="$tmp_root/data" HF_CLI="$tmp_root/bin/fake-hf" MODEL_PROFILE=general \
            bash scripts/download-models.sh --phase2 >> "$tmp_root/dl.log" 2>>"$tmp_root/dl.err" || { cat "$tmp_root/dl.log"; cat "$tmp_root/dl.err"; exit 1; }
          # Cadenas literales verificadas contra scripts/download-models.sh (log() anteponer [ts] [MODELS]).
          # Si alguna cambia, hay que regenerar comfyctl/tests/fixtures/download_models.log con este mismo dry-run.
          grep -q "INICIANDO FASE 1 (2.79 GiB):" "$tmp_root/dl.log"
          grep -q "PLAN FASE 1: 12 archivos" "$tmp_root/dl.log"
          grep -q "OK: InsightFace buffalo_l listo en" "$tmp_root/dl.log"
          grep -q "FASE 1 COMPLETADA\." "$tmp_root/dl.log"
          grep -q "RESUMEN FASE 1: Todos los modelos se descargaron correctamente" "$tmp_root/dl.log"
          grep -q "INICIANDO FASE 2 (Segundo Plano" "$tmp_root/dl.log"
          grep -q "PLAN FASE 2: 10 archivos (general)" "$tmp_root/dl.log"
          grep -q "SKIP (ya existe): InsightFace buffalo_l" "$tmp_root/dl.log"
