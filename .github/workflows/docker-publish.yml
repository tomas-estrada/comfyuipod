name: Build, Validate and Publish ComfyUI Vast.ai Image (GHCR)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Scripts, Action SHAs, Dockerfile & HF Catalog (CI-01 / CI-03)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Ejecutar ShellCheck sobre scripts Bash (§9.1)
        run: |
          shellcheck scripts/start.sh scripts/download-models.sh scripts/diag.sh tools/mac/comfy

      - name: Validar sintaxis Python, esquema de triage_patterns.json y portal sin CDN (§9.1)
        run: |
          python3 -m py_compile scripts/status-server.py
          python3 - << 'EOF'
          import json, pathlib, re

          patterns = json.loads(pathlib.Path("scripts/triage_patterns.json").read_text(encoding="utf-8"))
          assert isinstance(patterns, list) and len(patterns) >= 17, f"Expected >=17 patterns, got {len(patterns)}"
          required = {"id", "sources", "pattern", "severity", "cause", "first_command"}
          seen_ids = set()
          for p in patterns:
              missing = required - set(p.keys())
              assert not missing, f"Pattern {p.get('id')} missing keys: {missing}"
              assert p["id"] not in seen_ids, f"Duplicate pattern id: {p['id']}"
              seen_ids.add(p["id"])
              assert p["severity"] in ("alta", "media", "baja"), f"Invalid severity in {p['id']}"
              re.compile(p["pattern"], re.I)

          portal = pathlib.Path("config/portal/index.html")
          portal_bytes = portal.stat().st_size
          assert portal_bytes < 40960, f"Portal index.html exceeds 40 KiB ({portal_bytes} bytes)"
          allowed_links = {"https://github.com/Comfy-Org/ComfyUI"}
          for html_path in (portal, pathlib.Path("config/_starting.html")):
              txt = html_path.read_text(encoding="utf-8")
              assert "http://" not in txt.lower(), f"Insecure http:// found in {html_path}"
              res_refs = re.findall(r'(?:src\s*=\s*["\']https?://|<link[^>]+href\s*=\s*["\']https?://|@import\s+["\']https?://|url\(\s*["\']?https?://)', txt, re.I)
              assert not res_refs, f"External CDN/resource reference found in {html_path}: {res_refs}"
              for href in re.findall(r'href\s*=\s*["\'](https://[^"\']+)["\']', txt, re.I):
                  assert href in allowed_links, f"Unapproved external link in {html_path}: {href}"

          print(f"Validated {len(patterns)} triage patterns and portal ({portal_bytes} bytes, 0 external CDN refs).")
          EOF

      - name: Ejecutar Hadolint sobre Dockerfile (CRIT-01: SHA v3.1.0 verificado)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3008,DL3013,DL3042,SC2086

      - name: Verificar existencia real de todos los commit SHAs en config/nodes.lock (M-01 / N-03)
        run: |
          set -euo pipefail
          awk '$1 ~ /^(core|dep|node)$/ {print $2, $3, $4}' config/nodes.lock | while read -r name url sha; do
            echo "Verificando $name ($url @ $sha)..."
            rm -rf /tmp/chk_sha
            git init -q /tmp/chk_sha
            git -C /tmp/chk_sha fetch -q --depth=1 --filter=tree:0 "$url" "$sha" || {
              echo "::error::SHA $sha no existe en $url ($name)"
              exit 1
            }
            rm -rf /tmp/chk_sha
          done

      - name: Verificar disponibilidad HTTP 200/302 de los 26 modelos en HuggingFace (CI-03)
        run: |
          python3 - << 'EOF'
          import re, subprocess, sys

          text = open("scripts/download-models.sh", encoding="utf-8").read()
          text = re.sub(r"\\\s*\n", " ", text)
          pattern = re.compile(r'hf_fetch\s+"([^"]+)"\s+"([^"]+)"\s+"([^"]+)"\s+"([^"]+)"\s+"([^"]+)"')
          matches = pattern.findall(text)
          assert len(matches) >= 26, f"Expected >=26 models, found {len(matches)}"

          total_bytes = 0
          failures = 0
          for repo, path, _, local_name, repo_type in matches:
              if repo_type == "dataset":
                  url = f"https://huggingface.co/datasets/{repo}/resolve/main/{path}"
              else:
                  url = f"https://huggingface.co/{repo}/resolve/main/{path}"
              out = subprocess.check_output(["curl", "-sI", url], text=True)
              status_line = out.splitlines()[0] if out else ""
              size_match = re.search(r"^x-linked-size:\s*(\d+)", out, re.M | re.I)
              size_bytes = int(size_match.group(1)) if size_match else 0
              total_bytes += size_bytes
              ok = any(code in status_line for code in ("200", "302", "307"))
              print(f"[{'OK' if ok else 'FAIL'}] {status_line.strip()} | {size_bytes/1024**3:6.2f} GiB | {local_name}")
              if not ok:
                  failures += 1

          print(f"Total verified: {len(matches)} models | Total size: {total_bytes/1024**3:.2f} GiB | Failures: {failures}")
          sys.exit(1 if failures else 0)
          EOF

  build-and-push:
    name: Build Candidate, Smoke-Test & Promote to Latest (ALTA-01 / ALTA-02 / H-01 / M-02 / §9.2)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Liberar espacio en disco del runner de GitHub Actions (~30 GB extra)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h

      - name: Checkout del repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer tag candidato SHA en minúsculas (ALTA-01 / ALTA-02)
        id: meta_candidate
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-

      - name: Extraer referencia fija en minúsculas para caché de BuildKit (H-01)
        id: meta_cache
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=buildcache

      - name: Extraer tags finales de promoción (latest / semver)
        id: meta_final
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Construir y publicar SOLO el tag candidato sha-* (ALTA-01 / H-01 / §7.2)
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta_candidate.outputs.tags }}
          labels: ${{ steps.meta_candidate.outputs.labels }}
          build-args: |
            IMAGE_TAG=${{ fromJSON(steps.meta_candidate.outputs.json).tags[0] }}
            BUILD_DATE=${{ fromJSON(steps.meta_candidate.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=registry,ref=${{ fromJSON(steps.meta_cache.outputs.json).tags[0] }}
          cache-to: type=registry,ref=${{ fromJSON(steps.meta_cache.outputs.json).tags[0] }},mode=max

      - name: Purgar caché local de BuildKit antes del pull del candidato (M-02)
        run: |
          df -h
          docker buildx prune --all --force
          docker system prune --all --force
          df -h

      - name: Smoke Test unitario + Full-Stack E2E (Nginx + status-server + Portal + Supervisor + SIGTERM, §9.2)
        run: |
          set -euo pipefail
          CANDIDATE_TAG="${{ fromJSON(steps.meta_candidate.outputs.json).tags[0] }}"
          echo "Ejecutando smoke test sobre: ${CANDIDATE_TAG}"
          docker pull "${CANDIDATE_TAG}"
          docker images "${CANDIDATE_TAG}"
          docker run --rm --entrypoint find "${CANDIDATE_TAG}" /workspace/comfyui-data/user -type f
          docker run --rm --entrypoint nginx "${CANDIDATE_TAG}" -t
          docker run --rm --entrypoint hf "${CANDIDATE_TAG}" version
          docker run --rm --entrypoint cat "${CANDIDATE_TAG}" /etc/comfyui/image.json
          docker run --rm --entrypoint python3 "${CANDIDATE_TAG}" -c \
            "import torch, onnxruntime as ort, insightface, cv2, huggingface_hub, hf_xet; print('Torch:', torch.__version__, 'CUDA:', torch.version.cuda, 'CV2:', cv2.__version__, 'HF:', huggingface_hub.__version__, 'ORT:', ort.get_available_providers())"
          docker run --rm --entrypoint cat "${CANDIDATE_TAG}" /etc/comfyui/requirements.lock > requirements.lock

          echo "=== Iniciando Smoke Test Full-Stack del contenedor (§9.2) ==="
          cid="$(docker run -d --name smoke -p 18188:8188 \
            -e SKIP_MODEL_DOWNLOAD=1 \
            -e COMFYUI_EXTRA_ARGS="--cpu" \
            -e COMFY_USER=admin \
            -e COMFY_PASS=ci-secret-9f8e7d \
            -e HF_TOKEN=hf_fake_token_for_ci_only \
            -e ENABLE_WEB_TERMINAL=1 \
            -e COMFY_MAX_RESTARTS=3 \
            -e COMFY_RESTART_DELAY=2 \
            "${CANDIDATE_TAG}")"
          cleanup() {
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # 1. Esperar /healthz -> 200 (máx 600s), mostrando docker logs si falla
          for i in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:18188/healthz >/dev/null 2>&1; then
              echo "[OK] /healthz respondió 200 en $((i*2))s"
              break
            fi
            if [ "$i" -eq 300 ]; then
              docker logs "$cid"
              echo "::error::Timeout (600s) esperando /healthz"
              exit 1
            fi
            sleep 2
          done

          # 2. Sin auth -> 401 en cada ruta protegida; /healthz -> 200
          for ep in / /home /status /status/api /report.md /diag /download-status /terminal/; do
            code_unauth="$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:18188${ep}")"
            [ "$code_unauth" = "401" ] || { echo "::error::Se esperaba 401 sin auth en ${ep}, se obtuvo ${code_unauth}"; exit 1; }
          done
          echo "[OK] Rutas protegidas devuelven 401 sin credenciales"

          # 3. Con auth -> 200 en /, /home, /status, /status/api, /report.md, /diag, /download-status, /terminal/
          for ep in / /home /status /status/api /report.md /diag /download-status /terminal/; do
            code_auth="$(curl -s -o /dev/null -w "%{http_code}" -u admin:ci-secret-9f8e7d "http://127.0.0.1:18188${ep}")"
            [ "$code_auth" = "200" ] || { echo "::error::Se esperaba 200 con auth en ${ep}, se obtuvo ${code_auth}"; exit 1; }
          done
          echo "[OK] Todas las rutas protegidas devuelven 200 con credenciales"

          # 4. /home contiene "ComfyUI" y no contiene "http://"; /status/api es JSON con comfyui.state == "running"
          home_html="$(curl -fsS -u admin:ci-secret-9f8e7d http://127.0.0.1:18188/home)"
          grep -q "ComfyUI" <<<"$home_html"
          if grep -qi "http://" <<<"$home_html"; then
            echo "::error::/home contiene enlaces http:// inseguros"
            exit 1
          fi
          api_json="$(curl -fsS -u admin:ci-secret-9f8e7d http://127.0.0.1:18188/status/api)"
          comfy_pid="$(API_JSON="$api_json" python3 -c 'import json, os; d = json.loads(os.environ["API_JSON"]); c = d.get("comfyui") or {}; assert c.get("state") == "running" and c.get("port_open") is True and c.get("pid"), f"Unexpected comfyui status: {c}"; print(c["pid"])')"
          echo "[OK] /home y /status/api verificados (comfyui.state=running, pid=${comfy_pid})"

          # 5. /report.md contiene "## 0. Triage" y "## 8. Drift" y NO contiene secretos
          report_md="$(curl -fsS -u admin:ci-secret-9f8e7d http://127.0.0.1:18188/report.md)"
          grep -q "## 0. Triage" <<<"$report_md"
          grep -q "## 8. Drift" <<<"$report_md"
          if grep -qE "ci-secret-9f8e7d|hf_fake_token" <<<"$report_md"; then
            echo "::error::Fuga de secretos en /report.md"
            exit 1
          fi
          diag_txt="$(curl -fsS -u admin:ci-secret-9f8e7d http://127.0.0.1:18188/diag)"
          grep -q "\[DIAG\] resumen:" <<<"$diag_txt"
          if grep -qE "ci-secret-9f8e7d|hf_fake_token" <<<"$diag_txt"; then
            echo "::error::Fuga de secretos en /diag"
            exit 1
          fi
          echo "[OK] /report.md y /diag válidos y sin fuga de secretos"

          # 6. docker logs NO contiene secretos definidos por el usuario
          if docker logs "$cid" 2>&1 | grep -qE "ci-secret-9f8e7d|hf_fake_token"; then
            echo "::error::Fuga de secretos en docker logs"
            exit 1
          fi
          echo "[OK] docker logs libre de secretos"

          # 7. Workers de Nginx corriendo como www-data + 404/405 en status-server
          docker exec "$cid" ps -o user= -C nginx | grep -q www-data
          code_404="$(curl -s -o /dev/null -w "%{http_code}" -u admin:ci-secret-9f8e7d http://127.0.0.1:18188/logs/etc-passwd)"
          [ "$code_404" = "404" ] || { echo "::error::Se esperaba 404 en /logs/etc-passwd, se obtuvo ${code_404}"; exit 1; }
          code_405="$(curl -s -o /dev/null -w "%{http_code}" -X POST -u admin:ci-secret-9f8e7d http://127.0.0.1:18188/status/api)"
          [ "$code_405" = "405" ] || { echo "::error::Se esperaba 405 en POST /status/api, se obtuvo ${code_405}"; exit 1; }
          echo "[OK] Nginx corre bajo www-data y /logs/etc-passwd -> 404, POST -> 405"

          # 8. Puertos internos 18188, 18189 y 7681 escuchan SOLO en 127.0.0.1 (0100007F en /proc/net/tcp)
          docker exec "$cid" python3 -c '
          lines = open("/proc/net/tcp").read().splitlines()[1:]
          listeners = {}
          for ln in lines:
              parts = ln.split()
              if parts[3] == "0A":
                  ip_hex, port_hex = parts[1].split(":")
                  listeners.setdefault(int(port_hex, 16), set()).add(ip_hex)
          for p in (18188, 18189, 7681):
              assert listeners.get(p) == {"0100007F"}, f"Port {p} not bound exclusively to 127.0.0.1: {listeners.get(p)}"
          print("Verified loopback-only listeners:", {p: list(listeners[p]) for p in (18188, 18189, 7681)})
          '

          # 9. Probar supervisor: matar main.py con kill -9 y verificar relanzamiento (rc=137, restarts==1)
          echo "Matando PID ${comfy_pid} con SIGKILL para probar supervisor..."
          docker exec "$cid" kill -9 "$comfy_pid"
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS http://127.0.0.1:18188/healthz >/dev/null 2>&1; then
              api_json="$(curl -fsS -u admin:ci-secret-9f8e7d http://127.0.0.1:18188/status/api || true)"
              sup_ok="$(API_JSON="$api_json" python3 -c 'import json, os; d = json.loads(os.environ["API_JSON"]); c = d.get("comfyui") or {}; le = c.get("last_exit") or {}; print("OK" if c.get("state") == "running" and int(c.get("restarts", 0)) == 1 and (le.get("code") == 137 or le.get("rc") == 137) else "")' 2>/dev/null || true)"
              if [ "$sup_ok" = "OK" ]; then
                echo "[OK] Supervisor relanzó ComfyUI tras SIGKILL (restarts=1, last_exit=137)"
                break
              fi
            fi
            if [ "$i" -eq 30 ]; then
              docker logs "$cid"
              echo "::error::El supervisor no relanzó ComfyUI en <=60s tras kill -9"
              exit 1
            fi
          done

          # 10. Probar apagado limpio por SIGTERM (docker stop -t 30) -> exit code 0
          echo "Probando docker stop -t 30..."
          docker stop -t 30 "$cid"
          exit_code="$(docker inspect "$cid" --format '{{.State.ExitCode}}')"
          [ "$exit_code" = "0" ] || { docker logs "$cid"; echo "::error::docker stop devolvió ExitCode=${exit_code} (esperado 0)"; exit 1; }
          echo "[OK] Contenedor apagado limpiamente con ExitCode=0"

      - name: Subir requirements.lock como artefacto de reproducibilidad (ALTA-05)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: requirements-lock
          path: requirements.lock

      - name: Promover imagen verificada a latest / semver (ALTA-01)
        run: |
          CANDIDATE_TAG="${{ fromJSON(steps.meta_candidate.outputs.json).tags[0] }}"
          while IFS= read -r target_tag; do
            if [ -n "${target_tag}" ]; then
              echo "Promoviendo ${CANDIDATE_TAG} -> ${target_tag}"
              docker buildx imagetools create -t "${target_tag}" "${CANDIDATE_TAG}"
            fi
          done <<< "${{ steps.meta_final.outputs.tags }}"
