          grep -q "/studio/app.js" <<<"$studio_html"

          studio_health_json="$(curl -fsS --max-time 10 -u admin:${smoke_comfy_pass} http://127.0.0.1:18188/studio/api/health)"
          studio_tpl_json="$(curl -fsS --max-time 10 -u admin:${smoke_comfy_pass} http://127.0.0.1:18188/studio/api/templates)"
          studio_status_api="$(curl -fsS --max-time 10 -u admin:${smoke_comfy_pass} http://127.0.0.1:18188/status/api)"
          # El catálogo esperado se DERIVA del registro (EXPECTED_M2_TEMPLATE_IDS) en vez de duplicar
          # la lista literal en el workflow: un literal acoplado ya rompió el smoke una vez.
          studio_tpl_expected="$(timeout 60 docker exec "$studio_cid" /opt/venvs/studio/bin/python -c 'from comfy_studio.templates import EXPECTED_M2_TEMPLATE_IDS as ids; print(chr(10).join(ids))')"
          ST_HEALTH="$studio_health_json" ST_TPL="$studio_tpl_json" ST_API="$studio_status_api" ST_TPL_EXPECTED="$studio_tpl_expected" python3 -c '
          import json, os
          h = json.loads(os.environ["ST_HEALTH"])
          assert h.get("status") == "ok" and h.get("server") == "ok" and h.get("comfyui") == "ok", f"Unexpected /studio/api/health: {h}"
          assert h.get("comfyui_reachable") is True and h.get("model_profile") == "studio" and h.get("llm_key_status") == "<definida>", h
          t = json.loads(os.environ["ST_TPL"])
          tpl_items = t.get("templates", [])
          tpl_ids = {item["id"] for item in tpl_items}
          expected_tpls = {row.strip() for row in os.environ["ST_TPL_EXPECTED"].splitlines() if row.strip()}
          assert expected_tpls, "EXPECTED_M2_TEMPLATE_IDS llegó vacío desde el contenedor"
          assert tpl_ids == expected_tpls, f"Unexpected templates: {tpl_ids} != {expected_tpls}"
          unavailable = {i["id"] for i in tpl_items if i.get("available") is False}
          # 3D y Animate son grupos opt-in (STUDIO_INCLUDE_3D / STUDIO_INCLUDE_ANIMATE):
          # sin sus pesos se declaran unavailable con reason, el resto disponibles.
          assert unavailable == {
            "hunyuan3d_image_to_3d",
            "wan_animate",
            "wan_animate_cont",
            "minimax_r2v",
          }, (
            f"Unexpected unavailable: {unavailable}"
          )
          api = json.loads(os.environ["ST_API"])
          st_svc = (api.get("services") or {}).get("studio_server") or {}
          assert st_svc == {"enabled": True, "running": True, "port": 18190}, f"Unexpected studio_server service: {st_svc}"
          s11 = [c for c in (api.get("strict") or {}).get("checks", []) if c.get("id") == "S11"]
          assert len(s11) == 1 and s11[0].get("status") == "ok", f"Expected S11 studio_health ok, got {s11}"
          print(f"[OK] Plantillas verificadas contra EXPECTED_M2_TEMPLATE_IDS: {len(expected_tpls)}")
          '
          echo "[OK] /studio/, /studio/api/health, /studio/api/templates y S11 studio_health verificados"

          # VAL-AUTH-001: si el usuario provee STUDIO_API_TOKEN, el banner de arranque NO lo imprime
          # (marca [OCULTO]) y comfyctl consume y borra /run/comfyui-api-token al supervisar (R-11).
          studio_boot_log="$(timeout 30 docker logs "$studio_cid" 2>&1)"
          grep -q "TOKEN DE API" <<<"$studio_boot_log" || { echo "::error::Falta el banner del token de API en el arranque"; exit 1; }
          grep -q "OCULTO" <<<"$studio_boot_log" || { echo "::error::Con STUDIO_API_TOKEN provisto, el banner debía marcarlo [OCULTO]"; exit 1; }
          if grep -qF "${smoke_studio_token}" <<<"$studio_boot_log"; then
            echo "::error::start.sh imprimió en claro el STUDIO_API_TOKEN provisto por el usuario"
            exit 1
          fi
          if timeout 30 docker exec "$studio_cid" test -e /run/comfyui-api-token; then
            echo "::error::/run/comfyui-api-token debía consumirse y borrarse al iniciar comfyctl supervise (R-11)"
            exit 1
          fi
          echo "[OK] VAL-AUTH-001: STUDIO_API_TOKEN provisto => marcador [OCULTO] y fichero efímero consumido"

          # M3-C: MCP (/mcp) tras Basic Auth + X-Studio-Token, y S12 mcp_health en /status/api
          code="$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" http://127.0.0.1:18188/mcp/health)"
          [ "$code" = "401" ] || { echo "::error::Se esperaba 401 sin auth en /mcp/health, se obtuvo ${code}"; exit 1; }
          mcp_health="$(curl -fsS --max-time 10 -u admin:${smoke_comfy_pass} http://127.0.0.1:18188/mcp/health)"
          MCP_HEALTH="$mcp_health" python3 -c '
          import json, os
          h = json.loads(os.environ["MCP_HEALTH"])
          assert h.get("status") == "ok" and h.get("mcp_enabled") is True, h
          assert h.get("token_required") is True, h
          '
          code="$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" -u admin:${smoke_comfy_pass} -X POST -H "Content-Type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\"}" http://127.0.0.1:18188/mcp)"
          [ "$code" = "401" ] || { echo "::error::Se esperaba 401 sin X-Studio-Token en /mcp, se obtuvo ${code}"; exit 1; }
          mcp_init="$(curl -fsS --max-time 10 -u admin:${smoke_comfy_pass} -X POST -H "Content-Type: application/json" -H "X-Studio-Token: ${smoke_studio_token}" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\"}" http://127.0.0.1:18188/mcp)"
          MCP_INIT="$mcp_init" python3 -c '
          import json, os
          r = json.loads(os.environ["MCP_INIT"])["result"]
          assert r["serverInfo"]["name"] == "comfy-studio-mcp", r
          assert "tools" in r["capabilities"], r
          '
          mcp_tools="$(curl -fsS --max-time 10 -u admin:${smoke_comfy_pass} -X POST -H "Content-Type: application/json" -H "X-Studio-Token: ${smoke_studio_token}" -d "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}" http://127.0.0.1:18188/mcp)"
          MCP_TOOLS="$mcp_tools" python3 -c '
          import json, os
          tools = {t["name"] for t in json.loads(os.environ["MCP_TOOLS"])["result"]["tools"]}
          assert {"list_projects", "list_assets", "list_templates", "enqueue_render", "job_status"} <= tools, tools
          assert "delegate_role" not in tools, tools
          '
          s12_api="$(curl -fsS --max-time 10 -u admin:${smoke_comfy_pass} http://127.0.0.1:18188/status/api)"
          ST_API_S12="$s12_api" python3 -c '
          import json, os
          api = json.loads(os.environ["ST_API_S12"])
          s12 = [c for c in (api.get("strict") or {}).get("checks", []) if c.get("id") == "S12"]
          assert len(s12) == 1 and s12[0].get("status") == "ok", f"Expected S12 mcp_health ok, got {s12}"
          '
          echo "[OK] M3-C: MCP /mcp (401 sin auth/token; initialize y tools/list con X-Studio-Token) y S12 mcp_health verificados"

          SMOKE_BASIC_AUTH="admin:${smoke_comfy_pass}" python3 - << 'EOF'
          import os
          import subprocess, time
          t0 = time.monotonic()
          out = subprocess.check_output(
              [
                  "curl",
                  "-fsSN",
                  "--max-time",
                  "2",
                  "-D",
                  "-",
                  "-u",
                  os.environ["SMOKE_BASIC_AUTH"],
                  "http://127.0.0.1:18188/studio/api/progress?max_events=1",
              ],
              text=True,
          )
          elapsed = time.monotonic() - t0
          assert elapsed < 2.0, f"SSE first event took {elapsed:.3f}s (>= 2.0s)"
          assert "text/event-stream" in out.lower(), f"Missing text/event-stream header: {out}"
          assert "cache-control: no-cache" in out.lower(), f"Missing Cache-Control: no-cache header: {out}"
          assert "event: heartbeat" in out, f"Missing immediate heartbeat event: {out}"
          print(f"[OK] SSE /studio/api/progress recibido en {elapsed * 1000:.1f} ms (< 2000 ms, proxy_buffering off)")
          EOF

          timeout 60 docker exec "$studio_cid" python3 -c '
          lines = open("/proc/net/tcp").read().splitlines()[1:]
          listeners = {}
          for ln in lines:
              parts = ln.split()
              if parts[3] == "0A":
                  ip_hex, port_hex = parts[1].split(":")
                  listeners.setdefault(int(port_hex, 16), set()).add(ip_hex)
          for p in (18188, 18189, 18190, 7681):
              assert listeners.get(p) == {"0100007F"}, f"Port {p} not bound exclusively to 127.0.0.1: {listeners.get(p)}"
          print("Verified studio loopback-only listeners:", {p: list(listeners[p]) for p in (18188, 18189, 18190, 7681)})
          '

          studio_rep="$(curl -fsS --max-time 60 -u admin:${smoke_comfy_pass} http://127.0.0.1:18188/report.md)"
          grep -q "Sin cambios respecto a" <<<"$studio_rep"
          studio_diag="$(curl -fsS --max-time 60 -u admin:${smoke_comfy_pass} http://127.0.0.1:18188/diag)"
          studio_st_json="$(curl -fsS --max-time 10 -u admin:${smoke_comfy_pass} http://127.0.0.1:18188/studio/api/status)"
          studio_logs="$(timeout 30 docker logs "$studio_cid" 2>&1)"

          cat > "${mock_hook_dir}/vastai" << 'EOF'
          #!/usr/bin/env bash
          if [ "${1:-}" = "show" ] && [ "${2:-}" = "instances" ]; then
            echo '{"instances":[{"id":1001,"actual_status":"running","public_ipaddr":"127.0.0.1","gpu_name":"RTX 5090","dph_total":0.65,"label":"comfy-studio","ports":{"8188/tcp":[{"HostPort":"18188"}]}}]}'
            exit 0
          fi
          exit 1
          EOF
          chmod +x "${mock_hook_dir}/vastai" tools/mac/comfy
          helper_open_out="$(PATH="${mock_hook_dir}:$PATH" COMFY_PASS="${smoke_comfy_pass}" COMFY_BROWSER="echo" tools/mac/comfy studio 1001)"
          grep -q "http://127.0.0.1:18188/studio/" <<<"$helper_open_out"
          helper_rep_out="$(PATH="${mock_hook_dir}:$PATH" COMFY_PASS="${smoke_comfy_pass}" STUDIO_LLM_KEY="$smoke_llm_key" tools/mac/comfy studio report 1001 --stdout)"
          grep -q "## 11. Estado de Comfy Studio" <<<"$helper_rep_out"
          grep -F -q '`STUDIO_LLM_FALLBACK_KEY` = `<no definida>`' <<<"$helper_rep_out"
          if grep -F -q '<definida> definida>' <<<"$helper_rep_out"; then
            echo "::error::Marcador multi-palabra <no definida> truncado en comfy studio report"
            exit 1
          fi

          if grep -qE "${smoke_comfy_pass}|${smoke_llm_key}|${smoke_studio_token}" <<<"${studio_rep}${studio_diag}${studio_status_api}${studio_st_json}${studio_logs}${helper_open_out}${helper_rep_out}"; then
            echo "::error::Fuga de STUDIO_LLM_KEY, COMFY_PASS o STUDIO_API_TOKEN en artefactos, helper o logs de smoke-studio"
            exit 1
          fi

          timeout 90 docker stop -t 30 "$studio_cid"
          studio_exit_code="$(timeout 30 docker inspect "$studio_cid" --format '{{.State.ExitCode}}')"
          [ "$studio_exit_code" = "0" ] || { timeout 30 docker logs "$studio_cid" || true; echo "::error::docker stop smoke-studio devolvió ExitCode=${studio_exit_code}"; exit 1; }
          timeout 60 docker rm -f "$studio_cid" >/dev/null 2>&1 || true
          studio_cid=""
          echo "[OK] Paso 15: Smoke Test E2E con MODEL_PROFILE=studio superado limpiamente (COMFY_TLS=0: HTTP sin cambios)"

          # ==========================================================================
          # Paso 15b: VAL-AUTH-001 (token autogenerado) + VAL-AUTH-002 (COMFY_TLS=1 en el MISMO 8188)
          # Segundo contenedor: sin STUDIO_API_TOKEN (se autogenera con openssl rand -hex 24) y con TLS.
          # ==========================================================================
          echo "=== Paso 15b: COMFY_TLS=1 + STUDIO_API_TOKEN autogenerado ==="
          studio_cid="$(timeout 300 docker run -d --name smoke-studio-tls -p 18188:8188 \
            -e MODEL_PROFILE=studio \
            -e SKIP_MODEL_DOWNLOAD=1 \
            -e STRICT_MIN_RAM_MB=4096 \
            -e STRICT_MIN_DISK_GB=1 \
            -e COMFYUI_EXTRA_ARGS="--cpu" \
            -e COMFY_USER=admin \
            -e COMFY_PASS=${smoke_comfy_pass} \
            -e STUDIO_LLM_KEY=${smoke_llm_key} \
            -e STUDIO_STUB_LLM=1 \
            -e COMFY_TLS=1 \
            -e ENABLE_WEB_TERMINAL=1 \
            -e PYTHONPATH=/tmp/mock_comfy_hook \
            -e MOCK_COMFYUI_SERVER=1 \
            -v "${mock_hook_dir}:/tmp/mock_comfy_hook:ro" \
            "${CANDIDATE_TAG}")"

          studio_deadline=$((SECONDS + 300))
          while true; do
            if curl -k -fsSI --max-time 5 https://127.0.0.1:18188/healthz >/dev/null 2>&1; then
              echo "[OK] VAL-AUTH-002: /healthz respondió 200 por HTTPS en el puerto público 8188"
              break
            fi
            if [ "$SECONDS" -ge "$studio_deadline" ]; then
              timeout 30 docker logs "$studio_cid" || true
              echo "::error::smoke-studio-tls no sirvió HTTPS en 8188 en <=300s"
              exit 1
            fi
            sleep 2
          done
          timeout 60 docker exec "$studio_cid" nginx -t
          # nginx responde 400 («plain HTTP request was sent to HTTPS port») si el puerto ya es TLS:
          # lo relevante es que NINGUNA petición HTTP en claro obtenga 200.
          plain_code="$(curl -s --max-time 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:18188/healthz || true)"
          [ "$plain_code" != "200" ] || { echo "::error::Con COMFY_TLS=1 el puerto 8188 no debe seguir sirviendo HTTP en claro"; exit 1; }

          # Rutas existentes intactas bajo TLS (mismo puerto, mismo edge nginx)
          tls_401="$(curl -k -s --max-time 10 -o /dev/null -w "%{http_code}" https://127.0.0.1:18188/studio/)"
          [ "$tls_401" = "401" ] || { echo "::error::Se esperaba 401 sin auth por HTTPS en /studio/, se obtuvo ${tls_401}"; exit 1; }
          for tls_route in "/studio/" "/studio/api/health" "/studio/api/templates" "/status/api" "/mcp/health"; do
            tls_code="$(curl -k -s --max-time 10 -o /dev/null -w "%{http_code}" -u admin:${smoke_comfy_pass} "https://127.0.0.1:18188${tls_route}")"
            [ "$tls_code" = "200" ] || { echo "::error::Se esperaba 200 por HTTPS con auth en ${tls_route}, se obtuvo ${tls_code}"; exit 1; }
          done

          # VAL-AUTH-001: token autogenerado impreso UNA sola vez en el banner y consumido del fichero efímero
          auto_log="$(timeout 30 docker logs "$studio_cid" 2>&1)"
          auto_token="$(sed -n 's/.*Token *: *\([0-9a-f]\{48\}\).*/\1/p' <<<"$auto_log" | head -n 1)"
          [ "${#auto_token}" -eq 48 ] || { echo "::error::No se encontró el STUDIO_API_TOKEN autogenerado (48 hex) en el banner de arranque"; exit 1; }
          grep -q "AUTOGENERADO" <<<"$auto_log" || { echo "::error::El banner debía marcar el token como AUTOGENERADO"; exit 1; }
          auto_occurrences="$(grep -oF "${auto_token}" <<<"$auto_log" | wc -l | tr -d ' ')"
          [ "$auto_occurrences" = "1" ] || { echo "::error::El token autogenerado aparece ${auto_occurrences} veces en docker logs (debe imprimirse UNA sola vez)"; exit 1; }
          if timeout 30 docker exec "$studio_cid" test -e /run/comfyui-api-token; then
            echo "::error::/run/comfyui-api-token debía consumirse y borrarse al iniciar comfyctl supervise (R-11)"
            exit 1
          fi

          # El token impreso es el que MCP acepta (prueba de que el banner no es decorativo)
          mcp_tls="$(curl -k -fsS --max-time 10 -u admin:${smoke_comfy_pass} -X POST -H "Content-Type: application/json" -H "X-Studio-Token: ${auto_token}" -d '{"jsonrpc":"2.0","id":1,"method":"initialize"}' https://127.0.0.1:18188/mcp)"
          MCP_TLS="$mcp_tls" python3 -c '
          import json, os
          r = json.loads(os.environ["MCP_TLS"])["result"]
          assert r["serverInfo"]["name"] == "comfy-studio-mcp", r
          '

          # Redacción ampliada en las superficies públicas (VAL-AUTH-001): el token nunca aparece en claro
          tls_rep="$(curl -k -fsS --max-time 60 -u admin:${smoke_comfy_pass} https://127.0.0.1:18188/report.md)"
          tls_diag="$(curl -k -fsS --max-time 60 -u admin:${smoke_comfy_pass} https://127.0.0.1:18188/diag)"
          tls_status="$(curl -k -fsS --max-time 10 -u admin:${smoke_comfy_pass} https://127.0.0.1:18188/status/api)"
          tls_logs="$(curl -k -fsS --max-time 10 -u admin:${smoke_comfy_pass} https://127.0.0.1:18188/logs/container?n=500 || true)"
          if grep -qF "${auto_token}" <<<"${tls_rep}${tls_diag}${tls_status}${tls_logs}"; then
            echo "::error::Fuga del STUDIO_API_TOKEN autogenerado en /report.md, /diag, /status/api o /logs/container"
            exit 1
          fi
          timeout 90 docker stop -t 30 "$studio_cid"
          tls_exit_code="$(timeout 30 docker inspect "$studio_cid" --format '{{.State.ExitCode}}')"
          [ "$tls_exit_code" = "0" ] || { timeout 30 docker logs "$studio_cid" || true; echo "::error::docker stop smoke-studio-tls devolvió ExitCode=${tls_exit_code}"; exit 1; }
          timeout 60 docker rm -f "$studio_cid" >/dev/null 2>&1 || true
          studio_cid=""
          echo "[OK] Paso 15b: VAL-AUTH-001 (token autogenerado una sola vez + redacción) y VAL-AUTH-002 (HTTPS en 8188) verificados"

          rm -rf "$mock_hook_dir" >/dev/null 2>&1 || true
          mock_hook_dir=""

      - name: Subir requirements.lock como artefacto de reproducibilidad (ALTA-05)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirements-lock
          path: requirements.lock
          retention-days: 14

      - name: Promover imagen verificada a latest / semver (ALTA-01)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          CANDIDATE_TAG="${{ fromJSON(steps.meta_candidate.outputs.json).tags[0] }}"
          while IFS= read -r target_tag; do
            if [ -n "${target_tag}" ]; then
              echo "Promoviendo ${CANDIDATE_TAG} -> ${target_tag}"
              timeout 300 docker buildx imagetools create -t "${target_tag}" "${CANDIDATE_TAG}"
            fi
          done <<< "${{ steps.meta_final.outputs.tags }}"
