[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off
    Parsers_File parsers.conf

[INPUT]
    Name        tail
    Path        /var/log/comfyui/*.log
    Tag         comfyui
    Parser      json
    DB          /var/log/flb_comfyui.db

[INPUT]
    Name        tail
    Path        /var/log/studio-server/*.log
    Tag         studio-server
    Parser      json
    DB          /var/log/flb_studio-server.db

[INPUT]
    Name        tail
    Path        /var/log/comfyctl/*.log
    Tag         comfyctl
    Parser      json
    DB          /var/log/flb_comfyctl.db

[OUTPUT]
    Name        loki
    Match       *
    Host        loki
    Port        3100
    Labels      job=fluentbit