[default]
preview_method = auto
git_exe =
use_uv = False
channel_url = https://raw.githubusercontent.com/Comfy-Org/ComfyUI-Manager/main
share_option = all
bypass_ssl = False
file_logging = True
component_policy = workflow
update_policy = stable-comfyui
windows_selector_event_loop_policy = False
model_download_by_agent = False
downgrade_blacklist =
# Nota (Sección 5 auditoría): security_level = weak funciona porque ComfyUI escucha
# exclusivamente en loopback (127.0.0.1:18188) detrás de Nginx con Basic Auth.
security_level = weak
always_lazy_install = False
# network_mode = offline: el Manager NO lanza el hilo default_cache_update() al
# arrancar (manager_server.py L2091), que intenta refrescar su catálogo desde
# raw.githubusercontent.com y lanza InvalidChannel sin red (rompe el warm-up de CI
# y el arranque del pod). El pod instala nodos bajo demanda vía el endpoint del
# Manager (no depende del refresco de catálogo al boot), así que offline es correcto.
network_mode = offline
db_mode = cache
