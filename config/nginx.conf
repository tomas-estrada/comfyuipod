user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    access_log /var/log/nginx/access.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Rate limit holgado para que los >100 chunks JS/CSS iniciales de ComfyUI carguen sin 503 (MED-01)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=50r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # Permitir subida de vídeos pesados e imágenes sin límite de tamaño (evita HTTP 413)
    client_max_body_size 0;
    client_body_timeout 3600s;

    # Timeouts largos para ejecuciones de vídeo pesadas (ej. ReActor + CodeFormer)
    proxy_connect_timeout 3600s;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;
    send_timeout 86400s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8188 default_server;
        listen [::]:8188 default_server;
        server_name _;

        # Evitar errores 404 innecesarios de favicon en el log
        location = /favicon.ico {
            auth_basic off;
            access_log off;
            log_not_found off;
            return 204;
        }

        # Healthcheck real hacia ComfyUI usando HEAD para no exponer metadatos de /system_stats (BAJA-03)
        location = /healthz {
            auth_basic off;
            proxy_method HEAD;
            proxy_pass http://127.0.0.1:18188/system_stats;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Página amigable mientras corre Fase 1 y ComfyUI aún no abre el puerto 18188 (BAJA-07)
        location = /_starting.html {
            internal;
            root /etc/comfyui;
            add_header Retry-After 8 always;
            add_header Cache-Control "no-store" always;
        }

        # Portal unificado /home (§3.1)
        location = /home {
            limit_req zone=auth_limit burst=60 nodelay;
            auth_basic "ComfyUI Vast.ai Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            alias /etc/comfyui/portal/index.html;
            default_type text/html;
            add_header Cache-Control "no-store" always;
        }

        # Servidor de estado, informe Markdown, diagnóstico y visor de logs (§8.2)
        location ~ ^/(status|status/api|report\.md|diag|logs/.*)$ {
            limit_req zone=auth_limit burst=60 nodelay;
            auth_basic "ComfyUI Vast.ai Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://127.0.0.1:18189;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
        }

        # Terminal web opcional ttyd (§8.1)
        location = /terminal {
            auth_basic "ComfyUI Vast.ai Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            return 301 /terminal/;
        }

        location /terminal/ {
            auth_basic "ComfyUI Vast.ai Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }

        # Visor en vivo del progreso de descarga de modelos en segundo plano
        location = /download-status {
            limit_req zone=auth_limit burst=60 nodelay;
            auth_basic "ComfyUI Vast.ai Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            default_type text/plain;
            alias /var/log/download-models.log;
        }

        # Endpoint WebSocket sin limit_req para sesiones interactivas continuas (MED-01)
        location /ws {
            auth_basic "ComfyUI Vast.ai Access";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://127.0.0.1:18188;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Reverse proxy principal hacia ComfyUI (127.0.0.1:18188)
        location / {
            limit_req zone=auth_limit burst=300 nodelay;
            auth_basic "ComfyUI Vast.ai Access";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_intercept_errors on;
            error_page 502 =503 /_starting.html;

            proxy_pass http://127.0.0.1:18188;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
