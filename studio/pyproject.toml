[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy_studio"
version = "0.1.0"
description = "Servidor FastAPI y agente del estudio ComfyUI (Wan 2.2 / VACE / IndexTTS / percepción)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "openai==3.39.0",
    "pydantic==2.14.1",
    "sqlite-vec==0.1.9",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
]
asr = [
    "whisperx==3.8.6",
    "funasr==1.4.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["comfy_studio*"]

[tool.setuptools.package-data]
"comfy_studio.templates.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
